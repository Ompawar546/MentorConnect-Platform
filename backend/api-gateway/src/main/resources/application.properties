spring.application.name=API-GATEWAY

server.port=8080

# ===========================
# Eureka
# ===========================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ===========================
# User Service
# ===========================
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**,/api/students/**,/api/mentors/**,/internal/**

# ===========================
# Connection Service
# ===========================
spring.cloud.gateway.server.webflux.routes[1].id=connection-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://CONNECTION-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/connections/**

# ===========================
# JWT
# ===========================
jwt.secret=MzEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM=

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web.cors=TRACE
logging.level.org.springframework.cloud.gateway=TRACE